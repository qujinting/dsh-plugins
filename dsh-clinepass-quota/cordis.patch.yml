# dsh-clinepass-quota bundle layer.
#
# 一行挂载插件的两半：
#
#   host 半边   — 解析 API Key（config → 环境变量 → 数据目录），查
#                 api.cline.bot 的 usage-limits / users/me / balance 三个只读
#                 接口，做 60 秒缓存与并发合并；注册 `clinepass_quota` 工具
#                 和 `/api/dsh-clinepass-quota` 路由。
#   client 半边 — lib/client.js，由 dsh-client-modules 按包的 `dsh.client`
#                 声明加载，挂设置页与会话标题栏徽章。
#
# profile 自己的 cordis.patch.yml 在本层之后生效，所以部署仍可覆盖这里的
# 任何值（例如换 baseUrl、改 cacheSeconds、写死 apiKey）。

- insert:
    - id: dsh-clinepass-quota
      name: 'dsh-clinepass-quota'
      config: {}
