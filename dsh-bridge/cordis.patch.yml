# dsh-bridge 的能力行。用户级覆盖写在 profile 的 cordis.patch.yml，不要改本文件。
#
# `confirm` 里的能力必须由调用方显式传 `{ confirm: true }`，否则只返回
# confirmation-required，不做任何动作。
#
# `serviceDeny` 是硬黑名单，命中即拒：默认只留下"惰性"服务（列表、查询、读结构），
# 进程执行（shell/subprocess/terminals）、文件系统（fs/workspace*）、插件生命周期
# （loader/hmr/pluginManager）、密钥与用户数据（credentials/settings/storage）全部关闭。
# 需要放开某一项时在 profile 里覆写本行的 config，而不是删掉整个列表。
#
# `serviceAllow` 非空即进入白名单模式：只有列出的服务可达，黑名单仍然优先。
# `methodDeny` 是方法级第二道闸，按服务名（精确或前缀，`*` 表示所有服务）配置；
# 放开 loader 这类服务时靠它挡回 update/create/remove/import。
#
# 安装后重启（restartOnInstall 一族）：
# plugin-manager 每次改插件都会以 `plugin-manager/operation` 广播一条结算记录。
# 记录里 application 是 restart-required 时，宿主自己没法把新条目装进正在跑的进程，
# 上游的做法是让 agent 转告用户「请重启 DSH」。dsh-bridge 监听这条广播并直接重启：
#
#   1. 写一份计划（启动什么、在哪个目录、等哪个 pid 退场）；
#   2. 拉起分离的 relay.js（能活过本进程）；
#   3. 等到 relay 的心跳才算数——收不到心跳就放弃，宿主保持运行；
#   4. 心跳到手后本进程退出：桌面端杀掉持有窗口的父进程，web/stdio 宿主走 appExit；
#   5. relay 等旧进程消失、等过单实例锁，用清掉 ELECTRON_RUN_AS_NODE / NODE_OPTIONS
#      的环境拉起新实例。
#
# 硬约束：`restartBudget` / `restartWindowMs` 限制单位时间内的重启次数（默认 5 分钟 3 次），
# 免得一个装不上的包把「装完重启」变成「无限重启」；`restartDryRun: true` 只写计划不动作，
# 用来先验证计划内容；`restartOnInstallReasons` 决定哪类变更允许自动重启。
- insert:
    - id: dsh-bridge
      name: 'dsh-bridge'
      config:
        timeoutMs: 15000
        auditLimit: 200
        confirm:
          - config.edit
          - plugin.restart
          - app.exit
          - app.restart
        serviceDeny:
          - credentials
          - configEditor
          - dshBridge
          - loader
          - hmr
          - pluginManager
          - shell
          - subprocess
          - terminals
          - fs
          - workspaceFiles
          - workspaceChanges
          - worktrees
          - workspaceRegistry
          - sandbox
          - sandboxPolicy
          - settings
          - storage
          - storageDomain
          - spillStore
          - deepseekAccount
          - webServer
          - remoteAccess
          - liveshareShares
        serviceAllow: []
        methodDeny:
          '*':
            - apply
            - bind
            - call
            - constructor
            - dispose
            - exec
            - exit
            - import
            - kill
            - restart
            - spawn
            - stop
            - terminate
          loader:
            - commit
            - create
            - ensureId
            - remove
            - resolveGroup
            - stop
            - update
          hmr:
            - invalidate
            - runExclusive
            - update
        breakerThreshold: 5
        breakerCooldownMs: 30000
        restartOnInstall: true
        restartOnInstallReasons:
          - install
          - remove
          - plugin
          - bundle
        relayHeartbeatMs: 4000
        relayDeadlineMs: 120000
        relaySettleMs: 1500
        relayRetry: 3
        restartDelayMs: 250
        restartBudget: 3
        restartWindowMs: 300000
        desktopTerminate: true
        restartDryRun: false
